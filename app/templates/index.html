<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soil Moisture Analyzer</title>
  <meta name="description" content="AI-powered soil moisture analyzer using deep learning">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --accent-primary: #3b82f6;
      --accent-secondary: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #475569;
      --error-color: #ef4444;
      --warning-color: #f59e0b;
      --success-color: #10b981;
      --info-color: #3b82f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1a2e 50%, var(--bg-primary) 100%);
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    /* Main Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Cards */
    .card {
      background: var(--bg-secondary);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .card-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card-body {
      padding: 1.5rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tab {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .tab:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }

    .tab.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Demo Images Grid */
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.75rem;
      max-height: 320px;
      overflow-y: auto;
      padding: 0.25rem;
    }

    .demo-grid::-webkit-scrollbar {
      width: 6px;
    }

    .demo-grid::-webkit-scrollbar-track {
      background: var(--bg-card);
      border-radius: 3px;
    }

    .demo-grid::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .demo-thumb {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      position: relative;
    }

    .demo-thumb:hover {
      border-color: var(--accent-primary);
      transform: scale(1.05);
    }

    .demo-thumb.selected {
      border-color: var(--accent-primary);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .demo-thumb.selected::after {
      content: '✓';
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: var(--accent-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
    }

    .demo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* File Upload */
    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .upload-zone:hover {
      border-color: var(--accent-primary);
      background: rgba(59, 130, 246, 0.05);
    }

    .upload-zone.dragover {
      border-color: var(--accent-primary);
      background: rgba(59, 130, 246, 0.1);
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .upload-zone p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .upload-zone input[type="file"] {
      display: none;
    }

    /* Preview Section */
    .preview-section {
      margin-bottom: 1.5rem;
    }

    .preview-container {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      position: relative;
    }

    .preview-container.empty {
      border: 2px dashed var(--border-color);
    }

    .preview-placeholder {
      text-align: center;
      color: var(--text-muted);
    }

    .preview-placeholder svg {
      width: 48px;
      height: 48px;
      margin-bottom: 0.75rem;
      opacity: 0.5;
    }

    #preview-image {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      display: none;
    }

    #preview-image.visible {
      display: block;
    }

    /* Predict Button */
    .predict-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .predict-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .predict-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .spinner.visible {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Result Section */
    .result-section {
      display: none;
    }

    .result-section.visible {
      display: block;
    }

    .result-card {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .result-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .result-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .result-class {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .suggestion-box {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border-left: 4px solid var(--accent-primary);
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* Confidence Bar */
    .confidence-section {
      margin-top: 1.25rem;
    }

    .confidence-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .confidence-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .confidence-value {
      font-weight: 600;
      color: var(--accent-primary);
    }

    .confidence-bar {
      height: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), #60a5fa);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    /* Error Message */
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      color: var(--error-color);
      display: none;
      align-items: center;
      gap: 0.75rem;
    }

    .error-message.visible {
      display: flex;
    }

    .error-icon {
      font-size: 1.25rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">💧</div>
        <h1>Soil Moisture Analyzer</h1>
      </div>
      <p class="subtitle">AI-powered moisture detection for optimal plant health</p>
    </header>

    <div class="main-grid">
      <!-- Left Panel: Input Selection -->
      <div class="card">
        <div class="card-header">
          <span>📷</span>
          <h2>Select Image</h2>
        </div>
        <div class="card-body">
          <!-- Tabs -->
          <div class="tabs">
            <button class="tab active" data-tab="demo">Demo Images</button>
            <button class="tab" data-tab="upload">Upload</button>
          </div>

          <!-- Demo Images Tab -->
          <div class="tab-content active" id="demo-tab">
            <div class="demo-grid" id="demo-grid">
              <!-- Loading skeleton -->
              <div class="loading-thumb"></div>
              <div class="loading-thumb"></div>
              <div class="loading-thumb"></div>
            </div>
          </div>

          <!-- Upload Tab -->
          <div class="tab-content" id="upload-tab">
            <div class="upload-zone" id="upload-zone">
              <div class="upload-icon">📁</div>
              <p>Click to upload or drag & drop</p>
              <p style="font-size: 0.8rem; margin-top: 0.5rem; color: var(--text-muted);">JPG, PNG supported</p>
              <input type="file" id="file-input" accept="image/*">
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel: Preview & Results -->
      <div class="card">
        <div class="card-header">
          <span>📊</span>
          <h2>Analysis Result</h2>
        </div>
        <div class="card-body">
          <!-- Preview Section -->
          <div class="preview-section">
            <div class="preview-container empty" id="preview-container">
              <div class="preview-placeholder" id="preview-placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p>Select an image to analyze</p>
              </div>
              <img id="preview-image" src="" alt="Preview">
            </div>
          </div>

          <!-- Predict Button -->
          <button class="predict-btn" id="predict-btn" disabled>
            <span class="spinner" id="spinner"></span>
            <span id="btn-text">Analyze Moisture</span>
          </button>

          <!-- Error Message -->
          <div class="error-message" id="error-message" style="margin-top: 1rem;">
            <span class="error-icon">⚠️</span>
            <span id="error-text">An error occurred</span>
          </div>

          <!-- Result Section -->
          <div class="result-section" id="result-section" style="margin-top: 1.5rem;">
            <div class="result-card">
              <div class="result-header">
                <div class="result-icon" id="result-icon">💧</div>
                <div>
                  <div class="result-label">Moisture Level</div>
                  <div class="result-class" id="result-class">-</div>
                </div>
              </div>
              <div class="suggestion-box" id="suggestion-box">
                -
              </div>
              <div class="confidence-section">
                <div class="confidence-header">
                  <span class="confidence-label">Confidence</span>
                  <span class="confidence-value" id="confidence-value">0%</span>
                </div>
                <div class="confidence-bar">
                  <div class="confidence-fill" id="confidence-fill" style="width: 0%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>Powered by TensorFlow & FastAPI</p>
    </footer>
  </div>

  <script>
    // DOM Elements
    const demoGrid = document.getElementById('demo-grid');
    const previewImage = document.getElementById('preview-image');
    const previewPlaceholder = document.getElementById('preview-placeholder');
    const previewContainer = document.getElementById('preview-container');
    const predictBtn = document.getElementById('predict-btn');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('spinner');
    const resultSection = document.getElementById('result-section');
    const resultClass = document.getElementById('result-class');
    const resultIcon = document.getElementById('result-icon');
    const suggestionBox = document.getElementById('suggestion-box');
    const confidenceValue = document.getElementById('confidence-value');
    const confidenceFill = document.getElementById('confidence-fill');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const fileInput = document.getElementById('file-input');
    const uploadZone = document.getElementById('upload-zone');

    // State
    let selectedImage = null;
    let selectedFile = null;
    let isDemo = true;

    // Tab Switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
        isDemo = tab.dataset.tab === 'demo';
        resetSelection();
      });
    });

    // Load Demo Images
    async function loadDemoImages() {
      try {
        const response = await fetch('/demo-images');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        demoGrid.innerHTML = '';
        if (!data.images || data.images.length === 0) {
          demoGrid.innerHTML = '<p style="padding: 1rem; color: var(--text-secondary);">No demo images found.</p>';
          return;
        }
        data.images.forEach(imageName => {
          const thumb = document.createElement('div');
          thumb.className = 'demo-thumb';
          const safeName = encodeURIComponent(imageName);
          thumb.innerHTML = `<img src="/static/test_images/${safeName}" alt="${imageName}" loading="lazy">`;
          thumb.addEventListener('click', () => selectDemoImage(thumb, imageName));
          demoGrid.appendChild(thumb);
        });
      } catch (err) {
        console.error('Failed to load demo images:', err);
        demoGrid.innerHTML = `<div style="padding: 1rem; color: var(--error-color);"><p>Failed to load demo images.</p><small>${err.message}</small></div>`;
      }
    }

    // Select Demo Image
    function selectDemoImage(thumb, imageName) {
      document.querySelectorAll('.demo-thumb').forEach(t => t.classList.remove('selected'));
      thumb.classList.add('selected');
      selectedImage = `/static/test_images/${encodeURIComponent(imageName)}`;
      selectedFile = null;
      isDemo = true;
      showPreview(selectedImage);
      enablePrediction();
    }

    // File Upload Handling
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => { uploadZone.classList.remove('dragover'); });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleFileSelect(file);
    });
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFileSelect(file);
    });

    function handleFileSelect(file) {
      selectedFile = file;
      selectedImage = null;
      isDemo = false;
      const reader = new FileReader();
      reader.onload = (e) => { showPreview(e.target.result); enablePrediction(); };
      reader.readAsDataURL(file);
    }

    function showPreview(src) {
      previewImage.src = src;
      previewImage.classList.add('visible');
      previewPlaceholder.style.display = 'none';
      previewContainer.classList.remove('empty');
    }

    function enablePrediction() {
      predictBtn.disabled = false;
      hideError();
      hideResult();
    }

    function resetSelection() {
      selectedImage = null;
      selectedFile = null;
      previewImage.classList.remove('visible');
      previewPlaceholder.style.display = 'block';
      previewContainer.classList.add('empty');
      predictBtn.disabled = true;
      hideError();
      hideResult();
      document.querySelectorAll('.demo-thumb').forEach(t => t.classList.remove('selected'));
      fileInput.value = '';
    }

    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.add('visible');
    }

    function hideError() { errorMessage.classList.remove('visible'); }
    function hideResult() { resultSection.classList.remove('visible'); }

    function showResult(score, category, suggestion, color, confidence) {
      resultClass.textContent = `${category} (${score}%)`;
      resultClass.style.color = color;

      resultIcon.innerHTML = category.includes('Low') ? '⚠️' : (category.includes('Optimal') ? '✅' : '🌊');
      resultIcon.style.background = `${color}20`;

      suggestionBox.textContent = suggestion;
      suggestionBox.style.borderLeftColor = color;

      confidenceValue.textContent = `${score}%`;
      confidenceFill.style.width = `${score}%`;
      confidenceFill.style.background = color;

      resultSection.classList.add('visible');
    }

    // Prediction
    async function predict() {
      if (!selectedImage && !selectedFile) {
        showError('Please select an image first');
        return;
      }

      predictBtn.disabled = true;
      spinner.classList.add('visible');
      btnText.textContent = 'Analyzing...';
      hideError();
      hideResult();

      try {
        const formData = new FormData();
        if (selectedFile) {
          formData.append('file', selectedFile);
        } else {
          const imgResponse = await fetch(selectedImage);
          if (!imgResponse.ok) throw new Error(`Failed to load image: ${imgResponse.status}`);
          const blob = await imgResponse.blob();
          const filename = selectedImage.split('/').pop();
          formData.append('file', blob, filename);
        }

        const response = await fetch('/predict', { method: 'POST', body: formData });
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`Server error (${response.status}): ${errorText}`);
        }

        const data = await response.json();
        showResult(data.moisture_score, data.moisture_category, data.suggestion, data.color, data.confidence);

      } catch (err) {
        console.error('Prediction failed:', err);
        showError(err.message || 'Failed to analyze moisture. Please try again.');
      } finally {
        predictBtn.disabled = false;
        spinner.classList.remove('visible');
        btnText.textContent = 'Analyze Moisture';
      }
    }

    predictBtn.addEventListener('click', predict);
    loadDemoImages();
  </script>
</body>

</html>
